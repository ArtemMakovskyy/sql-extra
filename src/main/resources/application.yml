spring:
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5434}/${POSTGRES_DB:app_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.common-master.yml

server:
  port: ${SERVER_PORT:8080}

seeder:
  products: ${SEEDER_PRODUCTS:5000}
  sessions: ${SEEDER_SESSIONS:20000}
  accounts: ${SEEDER_ACCOUNTS:10000}