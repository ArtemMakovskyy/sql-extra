services:

  db-postgres:
    container_name: db-postgres
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  app:
    container_name: sql-extra-app
    env_file: .env
    build: .
    depends_on:
      db-postgres:
        condition: service_healthy
    restart: on-failure
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-postgres:5432/app_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SEEDER_PRODUCTS: ${SEEDER_PRODUCTS}
      SEEDER_SESSIONS: ${SEEDER_SESSIONS}
      SEEDER_ACCOUNTS: ${SEEDER_ACCOUNTS}
      JAVA_TOOL_OPTIONS: >
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data: